name: Post Social Media Content

on:
  schedule:
    - cron: '0 13 * * *'   #  7:00 AM Mountain Time (MDT)
    - cron: '30 14 * * *'  #  8:30 AM Mountain Time
    - cron: '0 16 * * *'   # 10:00 AM Mountain Time
    - cron: '30 17 * * *'  # 11:30 AM Mountain Time
    - cron: '0 19 * * *'   #  1:00 PM Mountain Time
    - cron: '30 20 * * *'  #  2:30 PM Mountain Time
    - cron: '0 22 * * *'   #  4:00 PM Mountain Time
    - cron: '30 23 * * *'  #  5:30 PM Mountain Time
    - cron: '0 1 * * *'    #  7:00 PM Mountain Time
    - cron: '30 2 * * *'   #  8:30 PM Mountain Time
  workflow_dispatch:         # allows manual "Run workflow" button in GitHub

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_CAROUSEL_WEBHOOK_URL: ${{ secrets.MAKE_CAROUSEL_WEBHOOK_URL }}
        run: python bot.py
