name: Post Social Media Content

on:
  schedule:
    - cron: '0 14 * * *'   # 8:00 AM Mountain Time (MDT)
    - cron: '0 17 * * *'   # 11:00 AM Mountain Time
    - cron: '0 20 * * *'   # 2:00 PM Mountain Time
    - cron: '0 23 * * *'   # 5:00 PM Mountain Time
    - cron: '0 2 * * *'    # 8:00 PM Mountain Time
  workflow_dispatch:         # allows manual "Run workflow" button in GitHub

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_CAROUSEL_WEBHOOK_URL: ${{ secrets.MAKE_CAROUSEL_WEBHOOK_URL }}
        run: python bot.py
